<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revan AI by Aditya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="text-align:center; color:#ffa500; margin-top:20px;">Revan AI by Aditya</h1>

<div id="loginContainer">
    <h3>Login</h3>
    <input type="text" id="loginUsername" placeholder="Username">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p>Belum punya akun? <span id="showRegister" style="color:#ffa500; cursor:pointer;">Daftar</span></p>
</div>

<div id="registerContainer" style="display:none;">
    <h3>Daftar Akun</h3>
    <input type="text" id="regUsername" placeholder="Username">
    <input type="password" id="regPassword" placeholder="Password">
    <button id="registerBtn">Daftar</button>
    <p>Sudah punya akun? <span id="showLogin" style="color:#ffa500; cursor:pointer;">Login</span></p>
</div>

<script src="script.js"></script>
</body>
</html>
