<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revan AI 🔶</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN / REGISTER -->
<div id="auth" class="center">
  <h1>Revan AI 🔶</h1>
  <input id="username" placeholder="Username">
  <button onclick="register()">Daftar / Login</button>
</div>

<!-- CHAT UI -->
<div id="chatUI">
  <div id="topBar">
    <h2>Revan AI 🔶</h2>
    <div id="leaderboard">
      <h3>Leaderboard 🏆</h3>
      <ol id="topUsers"></ol>
    </div>
  </div>

  <div id="chat"></div>

  <div class="inputBox">
    <input id="input" placeholder="Ketik pesan ke Revan...">
    <button onclick="send()">➤</button>
  </div>

  <!-- Admin tools -->
  <div id="adminTools">
    <input id="banUser" placeholder="Ban user">
    <button onclick="ban()">Ban</button>
    <input id="newAdminUser" placeholder="Username jadi admin">
    <button onclick="makeAdmin()">Tambahkan Admin</button>
  </div>

  <!-- Premium -->
  <div id="premiumBox">
    <button onclick="buyPremium()">Beli Premium 💎</button>
  </div>

  <!-- Image Generator -->
  <div id="imageGen">
    <input id="imgPrompt" placeholder="Generate gambar...">
    <button onclick="generateImage()">Buat Gambar</button>
  </div>

  <!-- Friends -->
  <div id="friendsSection">
    <h3>Temanmu 👥</h3>
    <input id="searchUser" placeholder="Cari username...">
    <button onclick="searchUserFunc()">Cari</button>
    <div id="searchResults"></div>
    <h4>Daftar Teman:</h4>
    <ul id="friendsList"></ul>
    <div id="friendChatBox">
      <h4 id="chatWith"></h4>
      <div id="privateChat"></div>
      <input id="friendInput" placeholder="Kirim pesan ke teman...">
      <button onclick="sendFriendMessage()">Kirim</button>
    </div>
  </div>

  <button onclick="logout()" id="logoutBtn">Logout</button>
</div>

<script src="script.js"></script>
</body>
      </html>
