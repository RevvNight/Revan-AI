<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revan AI 🔥</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="chatUI">
  <div id="topBar">
    <img id="chatLogo" src="naga-api.png">
    <h2>Revan AI 🔥</h2>
  </div>

  <div id="chat" class="chatBox">
    <div class="botBubble">Hii<br>I'm Revan<br>Ask anything</div>
  </div>

  <div class="inputBox">
    <input id="input" placeholder="Tanya Revan AI...">
    <button onclick="sendMessage()">➤</button>
  </div>

  <button onclick="logout()" class="logoutBtn">Logout</button>
</div>

<script src="script.js"></script>
</body>
</html>
